name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - name: Check PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Test theme registration
        run: php Tests/registration.php
      - name: Validate Composer manifests
        run: |
          composer validate --strict
          composer --working-dir=Development validate --strict

  css:
    name: CSS and colour contrast
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Test themes and colour contrast
        run: node --test Tests/theme.test.mjs
      - name: Check generated CSS
        run: node Build/build.mjs --check
